pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

// Fix for groovy.xml.QName required by Flutter Gradle plugin
// Gradle 8.5 uses Groovy 3.0, need groovy-xml on classpath
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.codehaus.groovy:groovy-xml:3.0.22'
        classpath 'org.codehaus.groovy:groovy-json:3.0.22'
        classpath 'org.codehaus.groovy:groovy:3.0.22'
    }
}

include ":app"
