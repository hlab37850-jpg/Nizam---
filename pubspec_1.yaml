name: nizam_os
description: Nizam OS - Personal Life Operating System, offline-first Arabic RTL.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_secure_storage: 9.0.0
  local_auth: 2.1.8
  flutter_local_notifications: 17.1.2
  fl_chart: 0.68.0
  table_calendar: 3.0.9
  google_fonts: 6.1.0
  lucide_icons: 0.257.0
  uuid: 4.3.3
  intl: 0.19.0
  drag_and_drop_lists: 0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/nizam_os.png"
  image_path_android: "assets/icon/nizam_os.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A1931"
  adaptive_icon_foreground: "assets/icon/nizam_os.png"
  remove_alpha_ios: true
