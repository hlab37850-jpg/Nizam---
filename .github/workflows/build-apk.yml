name: Build Nizam APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nizam OS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Verify Flutter and project
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -f .github/workflows/build-apk.yml

          PACKAGE_NAME="$(awk '/^name:/{print $2; exit}' pubspec.yaml)"
          test "$PACKAGE_NAME" = "nizam_os"

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not path.exists():
              raise SystemExit("gradle-wrapper.properties not found")

          lines = []
          for line in path.read_text().splitlines():
              if line.startswith("distributionUrl="):
                  line = (
                      "distributionUrl="
                      "https\\://services.gradle.org/distributions/"
                      "gradle-8.4-bin.zip"
                  )
              lines.append(line)

          path.write_text("\n".join(lines) + "\n")
          PY
          grep -F "gradle-8.4-bin.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Flutter 3.22.3 Groovy XML dependency
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_BUILD="$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts"
          PLUGIN_SOURCE="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"

          test -f "$PLUGIN_BUILD"
          test -f "$PLUGIN_SOURCE"

          python3 - "$PLUGIN_BUILD" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = '    compileOnly("com.android.tools.build:gradle:7.3.0")'

          if marker not in text:
              raise SystemExit(
                  "Unexpected Flutter 3.22.3 Gradle plugin layout; "
                  "refusing an unsafe SDK modification."
              )

          # Flutter 3.22.3's flutter.groovy uses groovy.xml.QName and XmlParser.
          # Gradle's Groovy base plugin does not automatically add the separate
          # groovy-xml module to the compile classpath. Add the exact Groovy
          # 3.0.17 modules shipped by Gradle 8.4. Do not edit flutter.groovy.
          deps = (
              '    implementation("org.codehaus.groovy:groovy:3.0.17")\n'
              '    implementation("org.codehaus.groovy:groovy-xml:3.0.17")'
          )

          if "org.codehaus.groovy:groovy-xml:3.0.17" not in text:
              text = text.replace(marker, marker + "\n" + deps, 1)
              path.write_text(text)

          final_text = path.read_text()

          if "org.codehaus.groovy:groovy-xml:3.0.17" not in final_text:
              raise SystemExit("groovy-xml dependency was not added.")

          source = Path(
              path.parent / "src/main/groovy/flutter.groovy"
          ).read_text()

          if "import groovy.xml.QName" not in source:
              raise SystemExit("Expected Flutter 3.22.3 QName import was not found.")

          if "new XmlParser()" not in source:
              raise SystemExit("Expected Flutter 3.22.3 XmlParser usage was not found.")
          PY

          grep -F 'implementation("org.codehaus.groovy:groovy:3.0.17")' "$PLUGIN_BUILD"
          grep -F 'implementation("org.codehaus.groovy:groovy-xml:3.0.17")' "$PLUGIN_BUILD"
          grep -F 'import groovy.xml.QName' "$PLUGIN_SOURCE"
          grep -F 'new XmlParser()' "$PLUGIN_SOURCE"

      - name: Get dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Check Gradle
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
