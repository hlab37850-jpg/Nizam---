name: Build Nizam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      # Flutter 3.22.3 expects the Android project/wrapper layout
      # generated by this Flutter release. Regenerate platform files
      # so a missing gradle-wrapper.jar or stale Android files cannot
      # break the runner.
      - name: Refresh Android platform files
        run: |
          flutter create --project-name nizam_os --platforms=android --org com.nizam .

          # Flutter 3.22.3 imports groovy.xml.QName in flutter.groovy.
          # Gradle 8.x no longer exposes groovy-xml to this compile classpath.
          # Replace the compile-time QName type check with a runtime class-name check.
          FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          text = p.read_text()
          text = text.replace("import groovy.xml.QName\n", "")
          text = text.replace(
              "if (entry.key instanceof QName) {",
              "if (entry.key != null && entry.key.getClass().getName() == 'groovy.xml.QName') {",
          )
          p.write_text(text)
          PY

          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.4-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
