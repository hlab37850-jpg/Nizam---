name: Build Nizam APK

"on":
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Prepare Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$TMP_DIR/nizam_seed"
          test -f "$TMP_DIR/nizam_seed/android/gradle/wrapper/gradle-wrapper.jar"
          mkdir -p android/gradle/wrapper
          cp "$TMP_DIR/nizam_seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          rm -rf "$TMP_DIR"

      - name: Pin Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep 'distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch Flutter 3.22.3 Groovy QName compatibility
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          test -f "$FLUTTER_GROOVY"
          python3 - "$FLUTTER_GROOVY" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old_import = "import groovy.xml.QName\\n"
          old_check = "if (entry.key instanceof QName) {"
          new_check = "if (entry.key != null && entry.key.getClass().getName() == 'groovy.xml.QName') {"

          if old_import not in text:
              raise SystemExit("Expected Flutter 3.22.3 QName import was not found")
          if old_check not in text:
              raise SystemExit("Expected Flutter 3.22.3 QName check was not found")

          text = text.replace(old_import, "", 1)
          text = text.replace(old_check, new_check, 1)
          path.write_text(text)
          PY
          grep -n "groovy.xml.QName\|getClass().getName" "$FLUTTER_GROOVY" || true

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^name:' pubspec.yaml | awk '{print $2}')" = "nizam_os"
          test -f lib/main.dart
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f .github/workflows/build-apk.yml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
