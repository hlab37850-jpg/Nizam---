name: Build Nizam APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Verify Flutter and project identity
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          test "$(awk '/^name:/{print $2; exit}' pubspec.yaml)" = "nizam_os"
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f .github/workflows/build-apk.yml

      - name: Ensure Gradle wrapper jar without touching app sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$tmp/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$tmp"
          fi
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          lines = []
          for line in s.splitlines():
              if line.startswith('distributionUrl='):
                  line = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY
          grep -F 'gradle-8.4-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch Flutter 3.22.3 QName classpath
        shell: bash
        run: |
          set -euo pipefail
          export FLUTTER_PLUGIN_DIR="$FLUTTER_ROOT/packages/flutter_tools/gradle"
          test -f "$FLUTTER_PLUGIN_DIR/build.gradle.kts"
          test -f "$FLUTTER_PLUGIN_DIR/src/main/groovy/flutter.groovy"
          grep -Fq 'import groovy.xml.QName' "$FLUTTER_PLUGIN_DIR/src/main/groovy/flutter.groovy"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['FLUTTER_PLUGIN_DIR'])
          build = root / 'build.gradle.kts'
          text = build.read_text()
          dep = 'implementation("org.codehaus.groovy:groovy-xml:3.0.17")'
          if dep not in text:
              marker = 'compileOnly("com.android.tools.build:gradle:7.3.0")'
              if marker not in text:
                  raise SystemExit('Unexpected Flutter 3.22.3 Gradle plugin layout.')
              text = text.replace(marker, marker + '\n    ' + dep, 1)
              build.write_text(text)
          PY
          grep -Fq 'implementation("org.codehaus.groovy:groovy-xml:3.0.17")' "$FLUTTER_PLUGIN_DIR/build.gradle.kts"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
