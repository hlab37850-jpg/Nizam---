name: Build Nizam APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nizam OS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Verify Flutter and project
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f .github/workflows/build-apk.yml

          PACKAGE_NAME="$(awk '/^name:/{print $2; exit}' pubspec.yaml)"
          echo "Dart package: $PACKAGE_NAME"
          test "$PACKAGE_NAME" = "nizam_os"

      - name: Ensure Gradle wrapper JAR
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER_DIR="android/gradle/wrapper"
          WRAPPER_JAR="$WRAPPER_DIR/gradle-wrapper.jar"

          if [ ! -s "$WRAPPER_JAR" ]; then
            echo "Gradle wrapper JAR is missing. Creating a temporary Flutter Android project only to obtain the wrapper JAR."

            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT

            flutter create \
              --project-name nizam_os \
              --platforms=android \
              --org com.nizam \
              --no-pub \
              "$TMP_DIR/seed"

            test -s "$TMP_DIR/seed/android/gradle/wrapper/gradle-wrapper.jar"

            mkdir -p "$WRAPPER_DIR"
            cp "$TMP_DIR/seed/android/gradle/wrapper/gradle-wrapper.jar" "$WRAPPER_JAR"
          fi

          test -s "$WRAPPER_JAR"
          ls -lh "$WRAPPER_JAR"

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = path.read_text()
          lines = []

          for line in text.splitlines():
              if line.startswith("distributionUrl="):
                  line = "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip"
              lines.append(line)

          path.write_text("\n".join(lines) + "\n")
          PY

          grep -F "gradle-8.4-bin.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Flutter 3.22.3 Groovy XML correctly
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_BUILD="$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts"
          PLUGIN_SOURCE="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"

          test -f "$PLUGIN_BUILD"
          test -f "$PLUGIN_SOURCE"

          python3 - "$PLUGIN_BUILD" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = '    compileOnly("com.android.tools.build:gradle:7.3.0")'
          dependency = '    implementation(localGroovy())'

          if marker not in text:
              raise SystemExit(
                  "Unexpected Flutter 3.22.3 Gradle plugin layout; refusing unsafe SDK modification."
              )

          # Flutter 3.22.3 compiles flutter.groovy and uses groovy.xml.QName/XmlParser.
          # Gradle 8.4 distributes Groovy 3.0.17 and localGroovy() includes groovy-xml.
          # Add the Gradle-bundled Groovy exactly once to the plugin implementation classpath.
          if dependency not in text:
              text = text.replace(marker, marker + "\n" + dependency, 1)

          # Remove any remnants of the previous incorrect patches if a runner cache ever contains them.
          for bad in [
              '    implementation("org.codehaus.groovy:groovy:3.0.17")\n',
              '    implementation("org.codehaus.groovy:groovy-xml:3.0.17")\n',
          ]:
              text = text.replace(bad, "")

          # The previous workaround incorrectly changed GroovyCompile.groovyClasspath.
          text = text.replace(
              '\n\ntasks.withType<org.gradle.api.tasks.compile.GroovyCompile>().configureEach {\n'
              '    groovyClasspath = configurations.getByName("runtimeClasspath")\n'
              '}\n',
              '\n'
          )

          path.write_text(text)

          final_text = path.read_text()
          if dependency not in final_text:
              raise SystemExit("implementation(localGroovy()) was not added.")
          if 'groovy-xml:3.0.17' in final_text:
              raise SystemExit("Conflicting manual Groovy 3.0.17 dependency remains.")
          if 'groovyClasspath = configurations.getByName("runtimeClasspath")' in final_text:
              raise SystemExit("Incorrect GroovyCompile classpath patch remains.")

          source = Path(path.parent / "src/main/groovy/flutter.groovy").read_text()
          if "import groovy.xml.QName" not in source:
              raise SystemExit("Expected Flutter 3.22.3 QName import was not found.")
          if "new XmlParser()" not in source:
              raise SystemExit("Expected Flutter 3.22.3 XmlParser usage was not found.")
          PY

          echo "=== Flutter 3.22.3 Gradle plugin dependencies ==="
          grep -F 'implementation(localGroovy())' "$PLUGIN_BUILD"

          if grep -Fq 'groovy-xml:3.0.17' "$PLUGIN_BUILD"; then
            echo "ERROR: conflicting Groovy 3.0.17 dependency detected"
            exit 1
          fi

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Verify exact Gradle version and Groovy XML classpath
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

          GRADLE_VERSION="$(./gradlew --version | awk '/Gradle /{print $2; exit}')"
          echo "Gradle version: $GRADLE_VERSION"
          test "$GRADLE_VERSION" = "8.4"

          echo "Compiling Flutter Gradle plugin before APK build..."
          ./gradlew :gradle:compileGroovy --stacktrace --no-daemon

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          echo "Release APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
