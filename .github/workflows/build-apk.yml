name: Build Nizam APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Verify Flutter and project identity
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          test "$(awk '/^name:/{print $2; exit}' pubspec.yaml)" = "nizam_os"
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f .github/workflows/build-apk.yml

      - name: Ensure Gradle wrapper jar without touching app sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$tmp/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$tmp"
          fi
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          lines = []
          for line in s.splitlines():
              if line.startswith('distributionUrl='):
                  line = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY
          grep -F 'gradle-8.4-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch Flutter 3.22.3 Groovy QName dependency (runner-only)
        shell: bash
        run: |
          set -euo pipefail
          export FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          test -f "$FLUTTER_GROOVY"
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path(os.environ["FLUTTER_GROOVY"])
          s = p.read_text()

          # Flutter 3.22.3 imports groovy.xml.QName, but Gradle's compileGroovy
          # classpath on the GitHub runner may not expose groovy-xml.
          # Patch only the SDK copy on this runner; the Nizam OS source is untouched.
          if "import groovy.xml.QName" not in s:
              raise SystemExit("Flutter 3.22.3 source changed: QName import was not found.")

          pattern = re.compile(
              r"(?m)^\s*if\s*\(entry\.key\s+instanceof\s+QName\)\s*\{\s*"
              r"switch\s*\(entry\.key\.getLocalPart\(\)\)\s*\{"
          )
          replacement = """                                         if (entry.key?.respondsTo('getLocalPart')) {
                                             switch (entry.key.getLocalPart()) {"""

          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit("Flutter 3.22.3 QName usage block was not found in the expected form.")

          s2 = s2.replace("import groovy.xml.QName\n", "", 1)
          p.write_text(s2)

          # Structural verification: no compile-time QName symbol remains.
          final_text = p.read_text()
          if "import groovy.xml.QName" in final_text or "instanceof QName" in final_text:
              raise SystemExit("QName compile-time reference still exists after patch.")
          if "entry.key.getLocalPart()" not in final_text:
              raise SystemExit("QName local-part access was lost during patch.")
          PY

          grep -qF "if (entry.key?.respondsTo('getLocalPart'))" "$FLUTTER_GROOVY"
          grep -qF "switch (entry.key.getLocalPart())" "$FLUTTER_GROOVY"
          ! grep -qF "import groovy.xml.QName" "$FLUTTER_GROOVY"
          ! grep -qF "instanceof QName" "$FLUTTER_GROOVY"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
