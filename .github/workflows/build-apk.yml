name: Build Nizam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Java version
        run: java -version

      - name: Fix Gradle Wrapper Jar
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar || wget -q -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar || echo "skip"
          fi
          chmod +x gradlew

      - name: Patch Flutter Gradle Plugin for groovy.xml.QName
        run: |
          for f in $(find /opt/hostedtoolcache -name "build.gradle" -path "*flutter_tools/gradle/build.gradle" 2>/dev/null); do
            if ! grep -q "groovy-xml" "$f"; then
              cp "$f" "$f.bak" || true
              sed -i "s/implementation localGroovy()/implementation localGroovy()\n    implementation 'org.codehaus.groovy:groovy-xml:3.0.17'\n    implementation 'org.codehaus.groovy:groovy-json:3.0.17'/" "$f" || true
            fi
          done

      - name: Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
