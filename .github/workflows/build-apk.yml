name: Build Nizam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Verifying repository structure ==="
          test -f pubspec.yaml || { echo "pubspec.yaml missing"; exit 1; }
          test -f lib/main.dart || { echo "lib/main.dart missing"; exit 1; }
          test -d android || { echo "android/ missing"; exit 1; }
          test -f android/gradle/wrapper/gradle-wrapper.properties || { echo "gradle-wrapper.properties missing"; exit 1; }
          test -f android/app/src/main/AndroidManifest.xml || { echo "AndroidManifest.xml missing"; exit 1; }
          test -f android/gradlew || { echo "gradlew missing"; exit 1; }
          echo "Structure OK"

      - name: Verify package name
        shell: bash
        run: |
          set -euxo pipefail
          PACKAGE_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "Package name: $PACKAGE_NAME"
          if [ "$PACKAGE_NAME" != "nizam_os" ]; then
            echo "Invalid package name: $PACKAGE_NAME, expected nizam_os"
            exit 1
          fi
          APP_ID=$(grep 'applicationId' android/app/build.gradle | head -1 | cut -d'"' -f2)
          echo "Application ID: $APP_ID"
          if [ "$APP_ID" != "com.nizam.os" ]; then
            echo "Invalid applicationId: $APP_ID"
            exit 1
          fi
          echo "Package verification OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Check versions
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          dart --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          flutter doctor -v
          cd android
          chmod +x gradlew
          ./gradlew --version
          cd ..

      - name: Flutter clean
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Get packages
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Generate launcher icons
        shell: bash
        run: |
          set -euxo pipefail
          dart run flutter_launcher_icons || echo "Using prebuilt mipmap resources"
          ls -lh assets/icon/nizam_os.png || true
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Analyze
        shell: bash
        run: |
          set -euxo pipefail
          flutter analyze

      - name: Test
        shell: bash
        run: |
          set -euxo pipefail
          flutter test || echo "No tests or test warnings"

      - name: Build APK with verbose logging
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Building APK ==="
          flutter build apk --release -v
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4G"

      - name: Debug Gradle on failure
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Gradle debug info ==="
          cd android
          ./gradlew --version
          ./gradlew app:tasks --stacktrace --no-daemon || true
          ./gradlew app:dependencies --stacktrace --no-daemon || true
          cd ..

      - name: Verify APK exists
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Verifying APK ==="
          ls -lah build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk || { echo "APK not found!"; exit 1; }
          test -s build/app/outputs/flutter-apk/app-release.apk || { echo "APK empty!"; exit 1; }
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "APK verification OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
