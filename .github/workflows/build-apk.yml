name: Build Nizam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # Flutter 3.22.3's Gradle plugin imports groovy.xml.QName.
      # Some Gradle distributions no longer expose Groovy XML on the
      # compile classpath of Flutter's included Gradle build. The Flutter
      # plugin only needs the type check, so avoid a hard compile-time
      # dependency while preserving the runtime behavior.
      - name: Patch Flutter Groovy QName compatibility
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          test -f "$FLUTTER_GROOVY"
          cp "$FLUTTER_GROOVY" "$FLUTTER_GROOVY.nizam-backup"
          sed -i '/^import groovy\.xml\.QName$/d' "$FLUTTER_GROOVY"
          sed -i 's/entry\.key instanceof QName/entry.key.getClass().name == "groovy.xml.QName"/' "$FLUTTER_GROOVY"
          ! grep -n 'import groovy.xml.QName' "$FLUTTER_GROOVY"
          grep -n 'entry.key.getClass().name' "$FLUTTER_GROOVY" || true

      # The previous archive did not contain gradle-wrapper.jar.
      # Put the official wrapper jar in the project so Gradle can start
      # even on a clean GitHub runner.
      - name: Restore Gradle wrapper jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/gradle/wrapper
          curl --fail --retry 3 -L \
            https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
            -o android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
