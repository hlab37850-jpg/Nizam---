name: Build Nizam APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Verify Flutter and project identity
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          test "$(awk '/^name:/{print $2; exit}' pubspec.yaml)" = "nizam_os"
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f .github/workflows/build-apk.yml

      - name: Ensure Gradle wrapper jar without touching app sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$tmp/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$tmp"
          fi
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          lines = []
          for line in s.splitlines():
              if line.startswith('distributionUrl='):
                  line = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY
          grep -F 'gradle-8.4-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch Flutter 3.22.3 Groovy QName dependency
        shell: bash
        run: |
          set -euo pipefail
          export FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          test -f "$FLUTTER_GROOVY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["FLUTTER_GROOVY"])
          s = p.read_text()
          old_import = "import groovy.xml.QName\n"
          if old_import not in s:
              raise SystemExit("Unexpected Flutter 3.22.3 flutter.groovy: QName import not found.")
          s = s.replace(old_import, "", 1)
          old = "if (entry.key instanceof QName) {\n                                             switch (entry.key.getLocalPart()) {"
          new = "def localPart = entry.key?.respondsTo('getLocalPart') ? entry.key.getLocalPart() : entry.key?.toString()\n                                         if (localPart != null) {\n                                             switch (localPart) {"
          if old not in s:
              raise SystemExit("Unexpected Flutter 3.22.3 flutter.groovy: QName usage layout not found.")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          ! grep -Fq 'import groovy.xml.QName' "$FLUTTER_GROOVY"
          ! grep -Fq 'instanceof QName' "$FLUTTER_GROOVY"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
