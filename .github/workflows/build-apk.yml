name: Build Nizam APK

"on":
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Prepare Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$TMP_DIR/nizam_seed"
          test -f "$TMP_DIR/nizam_seed/android/gradle/wrapper/gradle-wrapper.jar"
          mkdir -p android/gradle/wrapper
          cp "$TMP_DIR/nizam_seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          rm -rf "$TMP_DIR"

      - name: Pin Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep 'distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Flutter 3.22.3 Groovy XML dependency
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="${FLUTTER_ROOT:?FLUTTER_ROOT was not provided by flutter-action}"
          FLUTTER_PLUGIN_BUILD="$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts"
          FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          test -f "$FLUTTER_PLUGIN_BUILD"
          test -f "$FLUTTER_GROOVY"
          grep -Fq 'import groovy.xml.QName' "$FLUTTER_GROOVY"
          python3 - "$FLUTTER_PLUGIN_BUILD" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          dependency = 'implementation("org.codehaus.groovy:groovy-xml:3.0.17")'
          if dependency not in text:
              marker = 'compileOnly("com.android.tools.build:gradle:7.3.0")'
              if marker not in text:
                  raise SystemExit("Flutter 3.22.3 Gradle plugin build file has an unexpected dependency layout; refusing to patch it.")
              text = text.replace(marker, marker + "\n    " + dependency, 1)
              path.write_text(text, encoding="utf-8")
          if dependency not in path.read_text(encoding="utf-8"):
              raise SystemExit("groovy-xml dependency was not added to the Flutter Gradle plugin classpath.")
          print("Verified Flutter 3.22.3 QName import and added groovy-xml 3.0.17 to the Gradle plugin implementation classpath.")
          PY
          grep -n 'groovy.xml.QName' "$FLUTTER_GROOVY"
          grep -n 'groovy-xml:3.0.17' "$FLUTTER_PLUGIN_BUILD"

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^name:' pubspec.yaml | awk '{print $2}')" = "nizam_os"
          test -f lib/main.dart
          test -f android/app/build.gradle
          test -f android/settings.gradle
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f .github/workflows/build-apk.yml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
