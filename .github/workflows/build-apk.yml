name: Build Nizam APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verifying repository structure ==="

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          echo "Structure OK"

      - name: Verify package configuration
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          echo "Package name: $PACKAGE_NAME"

          if [ "$PACKAGE_NAME" != "nizam_os" ]; then
            echo "ERROR: Expected nizam_os"
            exit 1
          fi

          APP_ID=$(grep 'applicationId' android/app/build.gradle | head -1 | cut -d'"' -f2)
          echo "Application ID: $APP_ID"

          if [ "$APP_ID" != "com.nizam.os" ]; then
            echo "ERROR: Expected com.nizam.os"
            exit 1
          fi

          echo "Package verification OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Check Flutter and Java
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Flutter ==="
          flutter --version

          echo "=== Dart ==="
          dart --version

          echo "=== Java ==="
          java -version

          echo "=== Flutter Doctor ==="
          flutter doctor -v

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail
          flutter clean

      - name: Get packages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Generate launcher icons
        shell: bash
        run: |
          set -euo pipefail

          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "flutter_launcher_icons is not configured"
          fi

          if [ -f assets/icon/nizam_os.png ]; then
            ls -lh assets/icon/nizam_os.png
          fi

          if [ -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            ls -lh android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          if [ -d test ] && find test -type f | grep -q .; then
            flutter test
          else
            echo "No tests found - continuing"
          fi

      - name: Build release APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       BUILDING NIZAM OS APK"
          echo "========================================"

          flutter build apk --release

          echo "=== APK OUTPUT ==="
          ls -lah build/app/outputs/flutter-apk/

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "========================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
