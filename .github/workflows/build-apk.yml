name: Build Nizam OS APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          test "$(awk '/^name:/{print $2; exit}' pubspec.yaml)" = "nizam_os"
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - name: Ensure Gradle wrapper jar
        shell: bash
        run: |
          set -euo pipefail
          JAR=android/gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$JAR" ] || [ ! -s "$JAR" ] || [ $(stat -c%s "$JAR" 2>/dev/null || wc -c < "$JAR") -lt 5000 ]; then
            TMPDIR=$(mktemp -d)
            flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$TMPDIR/seed"
            mkdir -p android/gradle/wrapper
            cp "$TMPDIR/seed/android/gradle/wrapper/gradle-wrapper.jar" "$JAR"
            rm -rf "$TMPDIR"
          fi
          test -s "$JAR"
          ls -lh android/gradle/wrapper/

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail
          PROP=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip|' "$PROP"
          cat "$PROP"

      - name: Verify Groovy fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q "groovyClasspath" android/settings.gradle
          echo "Groovy fix present"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
