name: Build Nizam APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nizam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Verify Flutter and project identity
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          test "$(awk '/^name:/{print $2; exit}' pubspec.yaml)" = "nizam_os"
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f .github/workflows/build-apk.yml

      - name: Ensure Gradle wrapper jar without touching app sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            flutter create --project-name nizam_os --platforms=android --org com.nizam --no-pub "$tmp/seed"
            mkdir -p android/gradle/wrapper
            cp "$tmp/seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$tmp"
          fi
          test -s android/gradle/wrapper/gradle-wrapper.jar

      - name: Pin Gradle 8.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          lines = []
          for line in s.splitlines():
              if line.startswith('distributionUrl='):
                  line = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY
          grep -F 'gradle-8.4-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Restore Flutter 3.22.3 Gradle plugin Groovy classpath (runner-only)
        shell: bash
        run: |
          set -euo pipefail
          plugin_build="$FLUTTER_ROOT/packages/flutter_tools/gradle/build.gradle.kts"
          plugin_source="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          test -f "$plugin_build"
          test -f "$plugin_source"

          # Flutter 3.22.3's Gradle plugin compiles flutter.groovy, which uses
          # groovy.xml.QName and groovy.xml.XmlParser. Gradle 8.4's bundled
          # Groovy is 3.0.17 and localGroovy() includes the groovy-xml module.
          # Put that exact Gradle-bundled Groovy runtime on the plugin's
          # implementation classpath. Do NOT modify flutter.groovy itself.
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["FLUTTER_ROOT"])
          p = root / "packages/flutter_tools/gradle/build.gradle.kts"
          s = p.read_text()
          if 'implementation(localGroovy())' not in s:
              marker = '    compileOnly("com.android.tools.build:gradle:7.3.0")'
              if marker not in s:
                  raise SystemExit('Flutter 3.22.3 build.gradle.kts has unexpected dependency layout; refusing to modify it.')
              s = s.replace(marker, marker + '\n    implementation(localGroovy())', 1)
              p.write_text(s)
          final_text = p.read_text()
          if 'implementation(localGroovy())' not in final_text:
              raise SystemExit('localGroovy() was not added to Flutter Gradle plugin classpath.')
          # Verify the upstream Flutter source remains intact.
          src = (root / "packages/flutter_tools/gradle/src/main/groovy/flutter.groovy").read_text()
          if 'import groovy.xml.QName' not in src:
              raise SystemExit('Flutter 3.22.3 source was unexpectedly modified or is not the expected SDK.')
          if 'new XmlParser()' not in src:
              raise SystemExit('Flutter 3.22.3 XmlParser source was unexpectedly modified or is not the expected SDK.')
          PY

          grep -qF 'implementation(localGroovy())' "$plugin_build"
          grep -qF 'import groovy.xml.QName' "$plugin_source"
          grep -qF 'new XmlParser()' "$plugin_source"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nizam-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
