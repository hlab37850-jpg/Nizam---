name: nizam_os
description: Nizam OS - Personal Life Operating System, offline-first Arabic RTL.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_secure_storage: 9.2.2
  local_auth: 2.2.0
  flutter_local_notifications: 19.4.0
  fl_chart: 0.68.0
  table_calendar: 3.1.2
  google_fonts: 6.2.1
  lucide_icons: 0.257.0
  uuid: 4.5.1
  intl: 0.19.0
  drag_and_drop_lists: 0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
